[project]
name = "felt-voice"
version = "0.1.0"
description = "Felt's voice: local STT (faster-whisper) + TTS (IndexTTS / Chatterbox / Piper) + RVC"
requires-python = ">=3.12"
dependencies = [
    "chatterbox-tts==0.1.7",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28",
    "infer-rvc-python>=1.3.1",
    "onnx-asr[cpu,hub]==0.12.0",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "setuptools<81",
    "sopro==2.2.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
felt-voice = "felt_voice:main"
felt-voice-serve = "felt_voice.api:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# torchcrepe 0.0.20 (via infer-rvc-python) pins librosa==0.9.1; chatterbox-tts
# pins librosa==0.11.0. RVC runs fine on 0.11.0 (proven in felt-voice-next,
# 2026-09-25), so override the stale pin.
override-dependencies = ["librosa==0.11.0"]
