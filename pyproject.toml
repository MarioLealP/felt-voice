[project]
name = "felt-voice"
version = "0.1.0"
description = "Felt's voice: local STT (faster-whisper) + TTS (Piper)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "infer-rvc-python>=1.3.1",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "setuptools<81",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
felt-voice = "felt_voice:main"
felt-voice-serve = "felt_voice.api:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
